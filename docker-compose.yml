services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicehub"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/servicehub
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DRIVER: org.postgresql.Driver
      DB_DDL_AUTO: validate
      DB_SHOW_SQL: "false"
      FLYWAY_ENABLED: "true"
      JWT_SECRET: docker-development-secret-with-at-least-32-characters
      JWT_EXPIRATION_MINUTES: 60
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
