spring:
  datasource:
    url: jdbc:h2:mem:servicehub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: test-secret-with-at-least-thirty-two-characters-long
    expiration-minutes: 60
